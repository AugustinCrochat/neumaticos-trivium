<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-label="Chapa patente formato anterior (1995-2016)">
  <!-- marco claro con extremos blancos -->
  <rect x="1.5" y="1.5" width="397" height="127" rx="12" fill="#eef0f3" stroke="#c4cad1" stroke-width="2"/>
  <!-- franja central negra lisa -->
  <rect x="50" y="6" width="300" height="118" fill="#000000"/>
  <!-- ARGENTINA en celeste -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#4aa8d8" letter-spacing="3">ARGENTINA</text>
  <!-- escudo en el extremo izquierdo -->
  <g transform="translate(25 24)">
    <path d="M-8 -1 C-10 6 -5 11 0 12 C5 11 10 6 8 -1" fill="none" stroke="#5fae5a" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="0" cy="3" rx="6" ry="8" fill="#ffffff" stroke="#c4cad1" stroke-width="0.6"/>
    <path d="M-6 -2 A6 8 0 0 1 6 -2 L6 0.5 L-6 0.5 Z" fill="#74acdf"/>
    <path d="M-5.6 7 A6 8 0 0 0 5.6 7 L5.8 4.5 L-5.8 4.5 Z" fill="#74acdf"/>
    <circle cx="0" cy="-10" r="2.2" fill="#f6b40e"/>
  </g>
  <!-- ranuras de fijación -->
  <rect x="14" y="104" width="22" height="5" rx="2.5" fill="#b9bfc7"/>
  <rect x="364" y="104" width="22" height="5" rx="2.5" fill="#b9bfc7"/>
</svg>
