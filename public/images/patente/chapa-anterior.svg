<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-label="Chapa patente formato anterior">
  <defs>
    <linearGradient id="negro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1c1f"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tornillo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#6b7078"/>
      <stop offset="1" stop-color="#25272b"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="398" height="128" rx="14" fill="url(#negro)"/>
  <rect x="1" y="1" width="398" height="46" rx="14" fill="url(#brillo)"/>
  <!-- filete blanco interior -->
  <rect x="8" y="8" width="384" height="114" rx="9" fill="none" stroke="#f1f3f5" stroke-width="2.2"/>
  <!-- título -->
  <text x="200" y="31" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#7dd3fc" letter-spacing="2.4">REPÚBLICA ARGENTINA</text>
  <rect x="24" y="39" width="352" height="1.2" fill="#f1f3f5" opacity="0.35"/>
  <!-- tornillos -->
  <circle cx="24" cy="104" r="4.6" fill="url(#tornillo)" stroke="#555a61" stroke-width="0.8"/>
  <rect x="21" y="103.4" width="6" height="1.3" fill="#15161a"/>
  <circle cx="376" cy="104" r="4.6" fill="url(#tornillo)" stroke="#555a61" stroke-width="0.8"/>
  <rect x="373" y="103.4" width="6" height="1.3" fill="#15161a"/>
</svg>
