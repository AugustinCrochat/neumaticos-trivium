<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-label="Chapa patente Mercosur">
  <defs>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ee"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a63b8"/>
      <stop offset="1" stop-color="#173f82"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="interior"><rect x="7" y="7" width="386" height="116" rx="9"/></clipPath>
    <radialGradient id="tornillo" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#9aa3ad"/>
    </radialGradient>
  </defs>
  <!-- marco negro -->
  <rect x="1" y="1" width="398" height="128" rx="14" fill="#0c0d0f"/>
  <!-- papel de la chapa -->
  <rect x="7" y="7" width="386" height="116" rx="9" fill="url(#papel)"/>
  <g clip-path="url(#interior)">
    <!-- franja azul -->
    <rect x="7" y="7" width="386" height="31" fill="url(#azul)"/>
    <rect x="7" y="7" width="386" height="14" fill="url(#brillo)"/>
    <!-- sello MERCOSUR: anillo de estrellas -->
    <g fill="#ffffff" opacity="0.95">
      <circle cx="26" cy="15.5" r="1.1"/><circle cx="31" cy="17" r="1.1"/><circle cx="33" cy="22" r="1.1"/>
      <circle cx="31" cy="27" r="1.1"/><circle cx="26" cy="28.5" r="1.1"/><circle cx="21" cy="27" r="1.1"/>
      <circle cx="19" cy="22" r="1.1"/><circle cx="21" cy="17" r="1.1"/>
    </g>
    <text x="40" y="25" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="700" fill="#ffffff" letter-spacing="0.8">MERCOSUR</text>
    <!-- título -->
    <text x="205" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#ffffff" letter-spacing="1.6">REPÚBLICA ARGENTINA</text>
    <!-- bandera -->
    <g>
      <rect x="352" y="13" width="31" height="19" rx="2" fill="#ffffff"/>
      <rect x="352" y="13" width="31" height="6.3" fill="#74acdf"/>
      <rect x="352" y="25.7" width="31" height="6.3" fill="#74acdf"/>
      <circle cx="367.5" cy="22.5" r="2.6" fill="#f6b40e"/>
      <rect x="352" y="13" width="31" height="19" rx="2" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
    </g>
    <!-- línea bajo la franja -->
    <rect x="7" y="38" width="386" height="1.5" fill="#0f2f63" opacity="0.5"/>
  </g>
  <!-- tornillos -->
  <circle cx="22" cy="104" r="4.6" fill="url(#tornillo)" stroke="#8b939c" stroke-width="0.8"/>
  <rect x="19" y="103.4" width="6" height="1.3" fill="#7d858e"/>
  <circle cx="378" cy="104" r="4.6" fill="url(#tornillo)" stroke="#8b939c" stroke-width="0.8"/>
  <rect x="375" y="103.4" width="6" height="1.3" fill="#7d858e"/>
</svg>
