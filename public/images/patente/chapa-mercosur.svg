<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img" aria-label="Chapa patente Mercosur">
  <defs>
    <clipPath id="interior"><rect x="4" y="4" width="392" height="122" rx="11"/></clipPath>
  </defs>
  <!-- marco negro -->
  <rect x="2" y="2" width="396" height="126" rx="13" fill="#fbfcfe" stroke="#0a0a0a" stroke-width="4"/>
  <g clip-path="url(#interior)">
    <!-- franja azul lisa -->
    <rect x="4" y="4" width="392" height="30" fill="#143a8f"/>
    <!-- sello MERCOSUR -->
    <g fill="#ffffff">
      <circle cx="28" cy="12" r="0.9"/><circle cx="32" cy="13.2" r="0.9"/><circle cx="33.8" cy="17" r="0.9"/>
      <circle cx="32" cy="20.8" r="0.9"/><circle cx="28" cy="22" r="0.9"/><circle cx="24" cy="20.8" r="0.9"/>
      <circle cx="22.2" cy="17" r="0.9"/><circle cx="24" cy="13.2" r="0.9"/>
    </g>
    <text x="28" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="5.2" font-weight="700" fill="#ffffff" letter-spacing="0.4">MERCOSUR</text>
    <!-- título -->
    <text x="200" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" letter-spacing="0.2">REPUBLICA ARGENTINA</text>
    <!-- bandera -->
    <rect x="357" y="10" width="27" height="17" fill="#ffffff"/>
    <rect x="357" y="10" width="27" height="5.7" fill="#74acdf"/>
    <rect x="357" y="21.3" width="27" height="5.7" fill="#74acdf"/>
    <circle cx="370.5" cy="18.5" r="2.2" fill="#f6b40e"/>
  </g>
</svg>
